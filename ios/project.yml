name: OpenBotMobile

options:
  bundleIdPrefix: app.openbot
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 23
    MARKETING_VERSION: 0.19.0

targets:
  OpenBotMobile:
    type: application
    platform: iOS
    sources:
      - path: OpenBotMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile
        PRODUCT_NAME: OpenBot
        INFOPLIST_FILE: OpenBotMobile/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets:
        - OpenBotMobileTests
        - OpenBotMobileUITests
      environmentVariables:
        OPENBOT_TEST_SERVER: "$(OPENBOT_TEST_SERVER)"
        OPENBOT_TEST_ACCESS_KEY: "$(OPENBOT_TEST_ACCESS_KEY)"

  OpenBotMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenBotMobileTests
    dependencies:
      - target: OpenBotMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenBot"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OpenBotMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenBotMobileUITests
    dependencies:
      - target: OpenBotMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenBotMobile
