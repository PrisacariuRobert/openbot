name: OpenBotMobile

options:
  bundleIdPrefix: app.openbot
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 28
    MARKETING_VERSION: 0.24.0
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  OpenBotMobile:
    type: application
    platform: iOS
    sources:
      - path: OpenBotMobile
      - path: Shared
    dependencies:
      - target: OpenBotShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile
        PRODUCT_NAME: OpenBot
        INFOPLIST_FILE: OpenBotMobile/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OpenBotMobile/OpenBotMobile.entitlements
    scheme:
      testTargets:
        - OpenBotMobileTests
        - OpenBotMobileUITests
      environmentVariables:
        OPENBOT_TEST_SERVER: "$(OPENBOT_TEST_SERVER)"
        OPENBOT_TEST_ACCESS_KEY: "$(OPENBOT_TEST_ACCESS_KEY)"

  OpenBotShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenBotShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile.share
        PRODUCT_NAME: OpenBotShare
        INFOPLIST_FILE: OpenBotShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: OpenBotShare/OpenBotShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  OpenBotMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OpenBotMobileTests
    dependencies:
      - target: OpenBotMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenBot.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenBot"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OpenBotMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OpenBotMobileUITests
    dependencies:
      - target: OpenBotMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openbot.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenBotMobile
