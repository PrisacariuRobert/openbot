name: Bug report
description: Report a reproducible problem without private data.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, read SECURITY.md instead. Never upload your Sidemates data folder (.openbot in a source checkout, or ~/Library/Application Support/Sidemates/data), credentials, browser profiles or private conversations."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Sidemates version or commit, operating system, where you used it (the Mac app, a browser or the Home Screen app on a phone), and the AI and model the teammate uses.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest steps using synthetic data, with expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Error text, relevant checks or screenshots with private information removed. State whether any external action happened or its outcome is uncertain.
