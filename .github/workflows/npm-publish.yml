name: npm package

# Task R4: `npx sidemates`. Publishes the package from each release tag once the
# owner has added an NPM_TOKEN secret; until then the job says so and stops.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13
          registry-url: https://registry.npmjs.org
      - name: Publish (needs the NPM_TOKEN secret)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then echo "No NPM_TOKEN secret yet; nothing was published."; exit 0; fi
          npm ci
          npm run test:npx
          npm publish --provenance --access public
